<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img" aria-label="Aditya Dattatray Rahate Avatar">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="avatarShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="240" height="240" rx="120" fill="url(#bgGrad)" />

  <!-- Outer Ring Accent -->
  <circle cx="120" cy="120" r="112" fill="none" stroke="#60a5fa" stroke-width="3" stroke-dasharray="6 4" opacity="0.6"/>

  <!-- Developer Silhouette / Graphic -->
  <!-- Head -->
  <circle cx="120" cy="92" r="42" fill="#eff6ff" />
  <!-- Hair / Glasses Accent -->
  <path d="M 88 88 Q 120 54 152 88" fill="none" stroke="#1e293b" stroke-width="12" stroke-linecap="round"/>
  <rect x="94" y="86" width="22" height="14" rx="4" fill="none" stroke="#1d4ed8" stroke-width="3.5" />
  <rect x="124" y="86" width="22" height="14" rx="4" fill="none" stroke="#1d4ed8" stroke-width="3.5" />
  <line x1="116" y1="93" x2="124" y2="93" stroke="#1d4ed8" stroke-width="3.5" stroke-linecap="round" />

  <!-- Smile -->
  <path d="M 108 116 Q 120 126 132 116" fill="none" stroke="#1e293b" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Torso & Shoulders -->
  <path d="M 52 205 C 56 156 84 148 120 148 C 156 148 184 156 188 205" fill="#e2e8f0" />
  <path d="M 88 152 L 120 188 L 152 152" fill="#3b82f6" />

  <!-- Code Badge Emblem -->
  <g transform="translate(150, 150)">
    <circle cx="28" cy="28" r="28" fill="#1e293b" stroke="#60a5fa" stroke-width="3"/>
    <text x="28" y="34" font-family="system-ui, sans-serif" font-weight="bold" font-size="16" fill="#60a5fa" text-anchor="middle">&lt;/&gt;</text>
  </g>
</svg>
