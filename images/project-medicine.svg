<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340" role="img" aria-label="Medicine Reminder & Health Dashboard Illustration">
  <defs>
    <linearGradient id="medBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="pillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="340" fill="url(#medBg)" rx="12" />

  <!-- UI Window Container -->
  <rect x="40" y="30" width="520" height="280" rx="10" fill="#ffffff" fill-opacity="0.05" stroke="#334155" stroke-width="1.5" />

  <!-- Header dots -->
  <circle cx="65" cy="52" r="5" fill="#ef4444" />
  <circle cx="80" cy="52" r="5" fill="#f59e0b" />
  <circle cx="95" cy="52" r="5" fill="#10b981" />
  <line x1="40" y1="72" x2="560" y2="72" stroke="#334155" stroke-width="1" />

  <!-- Dashboard Widgets -->
  <!-- Chart Card -->
  <rect x="65" y="92" width="280" height="195" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="85" y="122" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8">Patient Adherence Analytics</text>
  
  <!-- Bar chart bars -->
  <rect x="90" y="210" width="22" height="55" rx="4" fill="url(#barGrad)" />
  <rect x="125" y="170" width="22" height="95" rx="4" fill="url(#barGrad)" />
  <rect x="160" y="145" width="22" height="120" rx="4" fill="url(#barGrad)" />
  <rect x="195" y="180" width="22" height="85" rx="4" fill="url(#barGrad)" />
  <rect x="230" y="130" width="22" height="135" rx="4" fill="url(#barGrad)" />
  <rect x="265" y="155" width="22" height="110" rx="4" fill="url(#barGrad)" />
  <rect x="300" y="135" width="22" height="130" rx="4" fill="#38bdf8" />

  <!-- Base line -->
  <line x1="85" y1="265" x2="330" y2="265" stroke="#475569" stroke-width="1.5" />

  <!-- Heartbeat / EKG line -->
  <path d="M 85 145 L 130 145 L 140 125 L 152 165 L 165 110 L 175 155 L 185 145 L 230 145 L 240 120 L 255 170 L 265 135 L 275 145 L 325 145" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.4"/>

  <!-- Metric Card 1: Reminder Status -->
  <rect x="365" y="92" width="170" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <!-- Pill graphic -->
  <g transform="translate(385, 115)">
    <rect x="0" y="0" width="36" height="18" rx="9" fill="url(#pillGrad)" transform="rotate(-30)" />
    <rect x="18" y="0" width="18" height="18" rx="0" fill="#ffffff" opacity="0.9" transform="rotate(-30)" />
  </g>
  <text x="435" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Daily Dose</text>
  <text x="435" y="142" font-family="system-ui, sans-serif" font-size="18" font-weight="700" fill="#38bdf8">98.4%</text>
  <text x="385" y="168" font-family="system-ui, sans-serif" font-size="10" fill="#10b981">● Automated Alerts Active</text>

  <!-- Metric Card 2: PDF Report -->
  <rect x="365" y="197" width="170" height="90" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <rect x="385" y="215" width="24" height="32" rx="3" fill="#3b82f6" opacity="0.2" stroke="#3b82f6" stroke-width="1.5"/>
  <line x1="391" y1="223" x2="403" y2="223" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="391" y1="229" x2="403" y2="229" stroke="#38bdf8" stroke-width="1.5" />
  <line x1="391" y1="235" x2="399" y2="235" stroke="#38bdf8" stroke-width="1.5" />
  <text x="420" y="228" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#94a3b8">Printable Export</text>
  <text x="420" y="248" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#f8fafc">PDF Reports</text>
  <text x="385" y="274" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8">Python + Chart.js Engine</text>
</svg>
